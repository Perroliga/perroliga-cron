
name: Buscar Pichichi y Zamora

on:
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Pichichi
        env:
          API_BZZOIRO: ${{ secrets.API_BZZOIRO }}
        run: python pichichi_python.py

      - name: Guardar resultado Pichichi
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pichichi
          path: resultado_pichichi.json

      - name: Ejecutar Zamora
        env:
          API_BZZOIRO: ${{ secrets.API_BZZOIRO }}
        run: python zamora_python.py

      - name: Guardar resultado Zamora
        uses: actions/upload-artifact@v4
        with:
          name: resultado-zamora
          path: resultado_zamora.json

      - name: Enviar resultados a InfinityFree
        env:
          CLAVE_RESULTADOS: ${{ secrets.CLAVE_RESULTADOS }}
        run: |
          jq -n \
            --slurpfile pichichi resultado_pichichi.json \
            --slurpfile zamora resultado_zamora.json \
            '{pichichi: $pichichi[0], zamora: $zamora[0]}' \
            > resultados_combinados.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Result-Key: $CLAVE_RESULTADOS" \
            --data-binary @resultados_combinados.json \
            https://perroliga.wuaze.com/crons/recibir_pichichi_zamora.php
